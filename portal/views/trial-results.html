<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Crop · Trial results</title>
    <link rel="stylesheet" href="../static/crop-shell.css" />
  </head>
  <body>
    <h1>Trial results</h1>
    <div class="crop-toolbar">
      <label>
        Trial ID
        <input id="trialId" type="number" value="30" />
      </label>
      <button type="button" id="reload">Load results</button>
    </div>
    <ul class="crop-list" id="resultList"></ul>
    <p class="crop-status" id="status"></p>
    <script src="../static/crop-api.js"></script>
    <script>
      const status = document.getElementById("status");

      async function load() {
        const trialId = Number(document.getElementById("trialId").value || 30);
        const rows = await CropPortal.runSemanticRequest("crop.trial.results", { trial_id: trialId });
        document.getElementById("resultList").innerHTML = rows.length
          ? rows
              .map(
                (row) =>
                  `<li>${row.plot_code} · ${row.treatment_code || ""} · ${row.metric} = ${row.value ?? "—"}</li>`
              )
              .join("")
          : "<li class='crop-muted'>No measurements for this trial.</li>";
        CropPortal.setStatus(status, `Trial ${trialId}: ${rows.length} measurement(s)`);
      }

      document.getElementById("reload").addEventListener("click", () =>
        load().catch((e) => CropPortal.setStatus(status, e.message, true))
      );
      load().catch((e) => CropPortal.setStatus(status, e.message, true));
    </script>
  </body>
</html>
